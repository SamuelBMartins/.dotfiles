# mpv 0.41 — AMD RX 9070, Wayland/Hyprland

###### Video

# gpu-hq is only a compatibility alias now; high-quality is the current name.
profile=high-quality

# Vulkan Video hardware decoding requires gpu-next. The copy variant avoids
# the zero-copy Vulkan decoder/render deadlock seen in the captured freeze.
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vulkan-copy

# Let gpu-next choose framebuffer precision, tone mapping, dithering, and gamut
# mapping from the source and display instead of forcing old renderer values.

###### Scaling and image cleanup

# high-quality already selects ewa_lanczossharp for upscaling.
dscale=mitchell
cscale=mitchell
scale-antiring=0.7
dscale-antiring=0.7
cscale-antiring=0.7

# Use mpv/libplacebo's current, balanced defaults rather than old hand-tuned
# values. Toggle at runtime with the default 'd' binding when desired.
deband=yes

# The files in ~~/shaders are currently Git LFS pointer files, not GLSL code.
# Do not re-enable them until the real shader files have been downloaded.

###### Playback and interface

keep-open=yes
cursor-autohide=1000
save-position-on-quit=yes
osd-bar=no
osd-font-size=32
volume-max=100

###### Languages and subtitles

alang=jpn,ja,eng,en
slang=jpn,ja,eng,en
sub-auto=fuzzy
sub-font="Noto Sans CJK JP"
sub-font-size=40
sub-border-size=2
sub-shadow-color=0.0/0.0/0.0/0.50
sub-shadow-offset=2

###### Lossless, high-bit-depth screenshots

screenshot-format=png
screenshot-dir="~/Pictures/Screenshots"
screenshot-template="%f-%wH.%wM.%wS.%wT-#%#00n"
